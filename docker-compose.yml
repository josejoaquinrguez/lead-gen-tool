services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lead_gen_tool_app
    ports:
      - "8000:80"
    environment:
      DB_ENABLED: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: lead_gen_tool
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_CHARSET: utf8mb4
      APP_DOCKER: "true"
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    command: >
      bash -lc "mkdir -p storage/cache storage/cache/websites storage/debug
      && chown -R www-data:www-data storage
      && printf 'SetEnv APP_DOCKER true\nSetEnv DB_ENABLED true\nSetEnv DB_HOST mysql\nSetEnv DB_PORT 3306\nSetEnv DB_DATABASE lead_gen_tool\nSetEnv DB_USERNAME root\nSetEnv DB_PASSWORD root\nSetEnv DB_CHARSET utf8mb4\n' > /etc/apache2/conf-enabled/leadgen-env.conf
      && apache2-foreground"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: lead_gen_tool_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lead_gen_tool
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lead_gen_tool_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
